<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff"/>
  <style>text{font-family:Arial,sans-serif;fill:#111827} .head{fill:#1f4e78} .body{fill:#f8fafc;stroke:#64748b;stroke-width:2} .line{stroke:#334155;stroke-width:4;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700">ER-диаграмма базы данных</text>
  <rect x="120" y="120" width="380" height="430" class="body"/><rect x="120" y="120" width="380" height="70" class="head"/><text x="310" y="165" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">readings</text>
  <text x="155" y="235" font-size="22">id INTEGER PK</text><text x="155" y="285" font-size="22">n INTEGER</text><text x="155" y="335" font-size="22">t_s REAL</text><text x="155" y="385" font-size="22">sensor TEXT</text><text x="155" y="435" font-size="22">value REAL</text>
  <rect x="700" y="120" width="380" height="430" class="body"/><rect x="700" y="120" width="380" height="70" class="head"/><text x="890" y="165" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">events</text>
  <text x="735" y="235" font-size="22">id INTEGER PK</text><text x="735" y="285" font-size="22">n INTEGER</text><text x="735" y="335" font-size="22">t_s REAL</text><text x="735" y="385" font-size="22">type TEXT</text><text x="735" y="435" font-size="22">message TEXT</text>
  <path class="line" d="M500 300 H700"/><text x="600" y="285" text-anchor="middle" font-size="18">общий номер измерения n</text>
  <text x="600" y="630" text-anchor="middle" font-size="19">Таблицы связаны логически по номеру измерения и времени события</text>
